# Publish to PyPI when a version tag is pushed: `git tag v0.1.1 && git push origin v0.1.1`.
# The tag must match agentwebui_lite.__version__. PyPI trusts this workflow
# (trusted publishing), so no token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Check the tag matches the version
        run: |
          version=$(python -c 'import agentwebui_lite; print(agentwebui_lite.__version__)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
