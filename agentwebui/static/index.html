<!doctype html>
<html lang="en" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>AgentWebUI</title>
<link rel="icon" href="/brand/logo">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/brand/logo">
<link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/app.css">
<script>
  // Apply the saved theme before the first paint so the page never flashes the wrong colors.
  try {
    var p = JSON.parse(localStorage.getItem('awl.appearance') || '{}');
    var t = p.theme || 'dark', light = t === 'light' || t === 'paper' || (t === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches) || (t === 'custom' && p.base === 'light');
    document.documentElement.className = 'app' + (light ? ' light' : '') + ({ graphite: ' graphite', terminal: ' terminal', paper: ' paper', hc: ' hc' }[t] || '');
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding: 24px; font-family: system-ui">This page needs JavaScript.</p></noscript>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
