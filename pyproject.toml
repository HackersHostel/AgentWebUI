[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwebui"
dynamic = ["version"]  # agentwebui.__version__
description = "Chat with AI models and command-line agents from one small web page, on your own server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HackersHostel" }]
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[project.urls]
Source = "https://github.com/HackersHostel/AgentWebUI"

[project.scripts]
agentwebui = "agentwebui.__main__:main"

[tool.setuptools.packages.find]
include = ["agentwebui*"]

[tool.setuptools.dynamic]
version = { attr = "agentwebui.__version__" }

[tool.setuptools.package-data]
agentwebui = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
